<script>
/* ══ ZONES (5 zones aligned to IB PYP Year 1 strands) ══ */

  {id:0,name:"Addition Arena",emoji:"➕",color:"#3daa6e",bg:"#e8f8f0",text:"#1a4a2e",
   pokemon:"💧",pkName:"Piplup",pkType:"Water",typeColor:"#3a7fc8"},
  {id:1,name:"Subtraction Station",emoji:"➖",color:"#f5922f",bg:"#fff3e8",text:"#7a3a0a",

  {id:2,name:"Mixed Ops Maze",emoji:"🔀",color:"#4a8fdf",bg:"#e3f0fb",text:"#1a3f7a",

  {id:3,name:"Place Value & Time Tower",emoji:"🕐",color:"#9b45e8",bg:"#f3e8ff",text:"#4a1280",
   pokemon:"🔮",pkName:"Ralts",pkType:"Psychic",typeColor:"#9b45e8"}
];
const BADGES=[
  {at:40,label:"Piplup Badge 💧",color:"#3daa6e",desc:"Addition Ace"},
  {at:80,label:"Charmander Badge 🔥",color:"#f5922f",desc:"Subtraction Star"},
  {at:120,label:"Pikachu Badge ⚡",color:"#c8a800",desc:"Mixed Ops Master"},
  {at:160,label:"Ralts Badge 🔮",color:"#9b45e8",desc:"Place Value Pro"}
];
const WILD=['🐦','🐱','🦊','🐰'];
const TYPE_COLORS={Water:'#3a7fc8',Normal:'#a8a878',Electric:'#c8a800',Psychic:'#9848c0',Bug:'#a8b820'};

const SAVE_KEY='glenealy_y1_v1';

/* ══════════════════════════════════════════════════

/* ══ HELPERS ══ */
function el(id){return document.getElementById(id);}
function qs(sel,root){return (root||document).querySelector(sel);}
function ce(tag,attrs,text){
  var e=document.createElement(tag);
  if(attrs){
    var keys=Object.keys(attrs);
    for(var ki=0;ki<keys.length;ki++){
      var k=keys[ki],v=attrs[k];
      if(k==='class'){e.className=v;}
      else if(k==='style'){
        if(typeof v==='object'){var sk=Object.keys(v);for(var si=0;si<sk.length;si++)e.style[sk[si]]=v[sk[si]];}
        else e.setAttribute('style',v);
      }
      else if(k==='onclick'){e.onclick=v;}
      else if(k==='disabled'){if(v)e.disabled=true;}
      else{e.setAttribute(k,v);}
    }
  }
  if(text!=null&&text!==false&&text!==undefined){
    if(typeof text==='string'||typeof text==='number'){e.appendChild(document.createTextNode(String(text)));}
    else if(text&&text.nodeType){e.appendChild(text);}
  }
  return e;
}
function svgEl(tag,attrs,children){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  if(attrs){var ak=Object.keys(attrs);for(var ai=0;ai<ak.length;ai++)e.setAttribute(ak[ai],String(attrs[ak[ai]]));}
  if(children!=null){
    var arr=Array.isArray(children)?children:[children];
    for(var ci=0;ci<arr.length;ci++){
      var c=arr[ci];
      if(c==null)continue;
      if(typeof c==='string'||typeof c==='number'){e.appendChild(document.createTextNode(String(c)));}
      else if(c.nodeType){e.appendChild(c);}
    }
  }
  return e;
}
function svg(viewBox,w,children){
  const s=svgEl('svg',{viewBox,width:w||'100%',xmlns:'http://www.w3.org/2000/svg'});
  if(children)(Array.isArray(children)?children:[children]).forEach(c=>{if(c)s.appendChild(c);});
  return s;
}
function currentLevels(){return getLevels(S.diff);}
function currentLv(){const L=currentLevels();return L[Math.min(S.level,L.length-1)];}
function currentZone(){return ZONES[currentLv().z]||ZONES[0];}

function getLevelZoneRange(LEVELS,zid){
  const idxs=LEVELS.reduce((a,l,i)=>{if(l.z===zid)a.push(i);return a;},[]);
  return{first:idxs[0]||0,last:idxs[idxs.length-1]||0,count:idxs.length};
}
function isLastInZone(){
  const LEVELS=currentLevels();
  const{last}=getLevelZoneRange(LEVELS,LEVELS[S.level].z);
  return S.level===last;
}

/* ══ TEACH GRAPHICS ══ */
function teachGraphic(kind){
  function t(x,y,anchor,size,color,weight,str){
    return svgEl('text',{'x':x,'y':y,'text-anchor':anchor,'font-size':size,'fill':color,'font-weight':weight,'font-family':'Arial,sans-serif'},str);
  }
  function r(x,y,w,h,rx,fill,stroke,sw){
    var a={'x':x,'y':y,'width':w,'height':h,'rx':rx||0,'fill':fill||'#ddd'};
    if(stroke){a['stroke']=stroke;a['stroke-width']=sw||1;}
    return svgEl('rect',a);
  }
  function line(x1,y1,x2,y2,stroke,sw){
    return svgEl('line',{'x1':x1,'y1':y1,'x2':x2,'y2':y2,'stroke':stroke,'stroke-width':sw||1});
  }
  function circle(cx,cy,rad,fill,stroke,sw){
    var a={'cx':cx,'cy':cy,'r':rad,'fill':fill};
    if(stroke){a['stroke']=stroke;a['stroke-width']=sw||1;}
    return svgEl('circle',a);
  }
  function poly(pts,fill,stroke,sw){
    var a={'points':pts,'fill':fill};
    if(stroke){a['stroke']=stroke;a['stroke-width']=sw||1.5;}
    return svgEl('polygon',a);
  }
  function makeSvg(viewBox,children){
    var s=svgEl('svg',{'viewBox':viewBox,'width':'100%','xmlns':'http://www.w3.org/2000/svg'});
    children.forEach(function(c){if(c)s.appendChild(c);});
    return s;
  }

  if(kind==='count_dots'){
    var dots=[];
    var colors=['#3daa6e','#4a8fdf','#e8455a','#f5922f','#9b45e8'];
    for(var i=0;i<5;i++){
      dots.push(circle(15+i*22,30,9,colors[i]+'aa',colors[i],2));
      dots.push(t(15+i*22,33,'middle',10,'#fff',900,String(i+1)));
    }
    dots.push(t(65,56,'middle',10,'#3daa6e',900,'Count carefully!'));
    return makeSvg('0 0 130 62',dots);
  }
  if(kind==='count_line'){
    var ln=[];
    ln.push(r(5,24,120,8,4,'#dde8f0','#aac4da',1));
    for(var i=0;i<=10;i++){
      var x=5+i*12;
      ln.push(line(x,20,x,38,'#6a8ea8',i%5===0?1.5:0.8));
      if(i%5===0||i===1||i===2)ln.push(t(x,17,'middle',8,'#456',700,String(i)));
    }
    ln.push(t(65,50,'middle',9,'#3daa6e',900,'Number line'));
    return makeSvg('0 0 130 56',ln);
  }
  if(kind==='tens_ones'){
    var to=[];
    to.push(r(4,8,56,22,4,'#fffbe6','#e0c060',1.5));
    to.push(t(32,23,'middle',10,'#6b4200',900,'1 ten = 10'));
    to.push(r(70,8,56,22,4,'#e6f7ee','#3daa6e',1.5));
    to.push(t(98,23,'middle',10,'#135c34',900,'ones = 1'));
    to.push(t(65,44,'middle',9,'#333',700,'Place value'));
    to.push(t(65,56,'middle',10,'#3daa6e',900,'Tens | Ones'));
    return makeSvg('0 0 130 62',to);
  }
  if(kind==='numbond'){
    return makeSvg('0 0 130 72',[
      circle(65,20,18,'#4a8fdf22','#4a8fdf',2),
      t(65,24,'middle',12,'#1a2a3a',900,'10'),
      line(65,38,30,52,'#4a8fdf',2),
      line(65,38,100,52,'#3daa6e',2),
      circle(30,62,12,'#4a8fdf22','#4a8fdf',2),
      circle(100,62,12,'#3daa6e22','#3daa6e',2),
      t(30,66,'middle',11,'#1a2a3a',900,'6'),
      t(100,66,'middle',11,'#1a2a3a',900,'4'),
      t(65,78,'middle',9,'#555',700,'6 + 4 = 10')
    ]);
  }
  if(kind==='shape_triangle'){
    return makeSvg('0 0 130 80',[
      poly('65,10 10,70 120,70','#fff0f2','#e8455a',2),
      t(65,30,'middle',9,'#e8455a',800,'3 sides'),
      t(65,76,'middle',9,'#7a0f1e',900,'3 corners too!')
    ]);
  }
  if(kind==='shape_square'){
    return makeSvg('0 0 130 80',[
      r(30,10,68,60,2,'#e3f0fb','#4a8fdf',2),
      t(64,44,'middle',9,'#1a3f7a',800,'4 sides'),
      t(64,56,'middle',8,'#4a8fdf',700,'all equal!'),
      t(64,76,'middle',9,'#1a3f7a',900,'4 right angles')
    ]);
  }
  if(kind==='shape_circle'){
    return makeSvg('0 0 130 80',[
      circle(65,38,32,'#e6f7ee22','#3daa6e',2),
      t(65,42,'middle',9,'#135c34',800,'No corners!'),
      t(65,76,'middle',9,'#135c34',900,'0 sides, 0 corners')
    ]);
  }
  if(kind==='shape_rect'){
    return makeSvg('0 0 130 80',[
      r(10,18,110,44,2,'#fff3e0','#f5922f',2),
      t(65,44,'middle',9,'#7a3600',800,'2 long, 2 short'),
      t(65,76,'middle',9,'#7a3600',900,'4 right angles')
    ]);
  }
  if(kind==='shape_3d'){
    return makeSvg('0 0 130 80',[
      r(30,8,60,52,3,'#f3e8ff','#9b45e8',2),
      r(42,20,36,28,2,'#fff','#9b45e8',1.5),
      t(65,74,'middle',9,'#4a1280',900,'3D shape: cube'),
      t(65,16,'middle',8,'#9b45e8',700,'6 faces, 12 edges')
    ]);
  }
  if(kind==='shape_pos'){
    return makeSvg('0 0 130 80',[
      t(65,14,'middle',9,'#4a8fdf',800,'above ↑'),
      r(42,20,44,20,3,'#e3f0fb','#4a8fdf',1.5),
      t(65,34,'middle',10,'#1a3f7a',900,'object'),
      t(10,50,'start',9,'#3daa6e',800,'← left'),
      t(120,50,'end',9,'#e8455a',800,'right →'),
      t(65,66,'middle',9,'#555',800,'below ↓'),
      t(65,78,'middle',8,'#888',700,'position words')
    ]);
  }
  if(kind==='measure_ruler'){
    var lr=[r(5,26,120,8,3,'#dde8f0','#aac4da',1)];
    for(var i=0;i<=10;i++)lr.push(line(5+i*12,20,5+i*12,40,'#6a8ea8',i%5===0?1.5:.8));
    lr.push(t(65,14,'middle',9,'#4a8fdf',800,'Ruler (cm)'));
    lr.push(t(65,54,'middle',10,'#3daa6e',900,'length → cm'));
    return makeSvg('0 0 130 60',lr);
  }
  if(kind==='measure_scale'){
    return makeSvg('0 0 130 72',[
      svgEl('ellipse',{'cx':65,'cy':46,'rx':48,'ry':20,'fill':'#fff3e0','stroke':'#f5922f','stroke-width':2}),
      line(65,46,65,20,'#e8455a',2),
      circle(65,20,5,'#e8455a','#cc2200',1.5),
      t(65,66,'middle',9,'#7a3600',800,'weighing scale'),
      t(65,12,'middle',9,'#e8455a',900,'weight → kg or g')
    ]);
  }
  if(kind==='measure_clock'){
    var clk=[circle(65,36,32,'#fffdf0','#e0a020',2)];
    var nums=['12','3','6','9'];
    var numPos=[[65,13],[95,41],[65,62],[36,41]];
    for(var i=0;i<4;i++)clk.push(t(numPos[i][0],numPos[i][1],'middle',10,'#6b4200',900,nums[i]));
    clk.push(line(65,36,65,18,'#333',2.5));

    return makeSvg('0 0 130 78',clk);
  }
  if(kind==='measure_cap'){
    return makeSvg('0 0 130 72',[
      r(38,4,34,60,4,'#e3f0fb','#4a8fdf',1.5),
      r(38,30,34,34,3,'#4a8fdf',null,0),
      t(55,22,'middle',8,'#1a3f7a',700,'1000 mL'),
      t(55,74,'middle',9,'#1a3f7a',900,'capacity → L or mL')

  }
  if(kind==='pattern_ab'){
    var pa=[];
    var colours=['#e8455a','#4a8fdf','#e8455a','#4a8fdf','#e8455a'];
    for(var i=0;i<5;i++){
      pa.push(circle(15+i*24,30,10,colours[i]+'aa',colours[i],2));

    }

  if(kind==='pattern_count'){

    for(var i=0;i<4;i++){
      pc.push(r(8+i*30,40-vals[i]*3,22,vals[i]*3,3,cols[i]+'88',cols[i],1.5));

    }

  }
  return makeSvg('0 0 130 60',[
    t(65,28,'middle',28,'#333',400,'?'),
    t(65,50,'middle',10,'#555',700,'Think carefully!')

function stripAnswer(html){

}
function buildTeachPanel(lv,zone){
  const t=lv.teach;if(!t)return null;

  hdr.appendChild(ce('span',{style:{fontSize:'22px'}},'🦉'));

  hdr.appendChild(hdrText);
  panel.appendChild(hdr);
  const body=ce('div',{class:'teach-body'});
  const txt=ce('div',{class:'teach-txt'});
  if(t.steps && t.steps.length>0){
    t.steps.forEach(function(s,i){
      const row=ce('div',{class:'teach-step'});
      row.appendChild(ce('div',{class:'teach-num'},String(i+1)));
      const sp=ce('span');sp.innerHTML=stripAnswer(s);
      row.appendChild(sp);txt.appendChild(row);
    });
  } else if(t.text){
    const sp=ce('span');sp.innerHTML=stripAnswer(t.text);
    txt.appendChild(sp);
  }
  const nudge=ce('div',{class:'teach-formula'},'Think through the steps — you can do it! 💪');

  const gfxWrap=ce('div',{class:'teach-gfx'});
  const g=teachGraphic(t.graphic||'count_dots');

  return panel;
}

    }});
    if(cur){const here=ce('span',{class:'zone-here',style:{color:z.text}},'▶ NOW');zc.appendChild(here);}
    zc.appendChild(ce('div',{class:'zone-card-pk'},z.pokemon));
    zc.appendChild(ce('div',{class:'zone-card-title'},z.emoji+' '+z.name));
    zc.appendChild(ce('div',{class:'zone-card-sub'},z.pkName+' · '+z.pkType));
    zc.appendChild(ce('div',{class:'zone-card-prog',style:{color:z.color}},
      done===total?'✅ Complete!':done===0?'🔴 Not started':'⚡ '+done+'/'+total+' done'));
    zg.appendChild(zc);
  });
  mc.appendChild(zg);

  mc.appendChild(ce('div',{class:'section-label'},'Level Map'));
  const ms=ce('div',{class:'map-scroll'});
  const mg=ce('div',{class:'map-grid'});
  LEVELS.forEach((_,i)=>{
    const z=ZONES[LEVELS[i].z];const done=i<S.level,cur=i===S.level,free=i>S.level;
    const dot=ce('div',{
      class:'map-dot'+(done?' done':'')+(cur?' cur':'')+(free?' free':''),
      style:{background:free?undefined:z.color,color:free?'#555':'#fff',border:free?undefined:'2px solid '+z.color},
      onclick:()=>{S.level=i;S.chosen=null;S.wrongCount=0;S.zoneAnswers=[];save();renderBattle();}
    },done?'✓':cur?'★':''+(i+1));
    mg.appendChild(dot);
  });
  ms.appendChild(mg);mc.appendChild(ms);

  if(S.earnedBadges.length>0){
    mc.appendChild(ce('div',{class:'section-label'},'Badges Earned'));
    const bg=ce('div',{class:'badge-grid'});
    S.earnedBadges.forEach(b=>{
      bg.appendChild(ce('div',{class:'badge-item',style:{background:b.color+'18',borderColor:b.color,color:b.color}},b.label+' · '+b.desc));
    });
    mc.appendChild(bg);
  }
  wrap.appendChild(mc);root.appendChild(wrap);
}

/* ══ BATTLE SCREEN ══ */
function renderBattle(){
  const root=el('root');root.innerHTML='';
  const LEVELS=currentLevels();
  const lv=LEVELS[Math.min(S.level,LEVELS.length-1)];
  const zone=ZONES[lv.z]||ZONES[0];
  const pct=Math.round((S.level/LEVELS.length)*100);
  const wild=WILD[lv.z]||'🌟';
  const tc=TYPE_COLORS[zone.pkType]||'#666';
  const wrap=ce('div',{class:'screen active'});

  const hdr=ce('div',{class:'hdr'});
  hdr.appendChild(ce('div',{class:'logo'},'⭐ Glenealy Maths'));
  const hr=ce('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
  hr.appendChild(ce('div',{class:'diff-badge',style:{background:DIFF_COLORS[S.diff]}},DIFF_LABELS[S.diff]));
  hr.appendChild(ce('div',{class:'score-badge'},'🏅 '+S.score+'/'+LEVELS.length));
  hdr.appendChild(hr);wrap.appendChild(hdr);

  const pw=ce('div',{class:'prog-wrap'});
  const pb=ce('div',{class:'prog-bar-bg'});
  pb.appendChild(ce('div',{class:'prog-bar-fill',id:'prog-fill',style:{width:pct+'%'}}));
  pw.appendChild(pb);pw.appendChild(ce('div',{class:'prog-label',id:'prog-lbl'},'LV.'+(S.level+1)));
  wrap.appendChild(pw);

  const bc=ce('div',{class:'battle-card',id:'battle-card'});

  const lid=ce('div',{class:'pk-lid'});
  const light=ce('div',{class:'pk-light-main'});lid.appendChild(light);
  const lights=ce('div',{class:'pk-lights-sm'});
  ['#ff9090','#ffee80','#90ee90'].forEach(c=>{lights.appendChild(ce('div',{class:'pk-light-sm',style:{background:c}}));});
  lid.appendChild(lights);
  lid.appendChild(ce('div',{class:'pk-lid-title'},zone.emoji+' '+zone.name+' · Q'+(S.level+1)));
  bc.appendChild(lid);

  const scene=ce('div',{class:'battle-scene'});
  scene.appendChild(ce('div',{class:'plat-e'}));scene.appendChild(ce('div',{class:'plat-p'}));

  const eHud=ce('div',{class:'enemy-hud'});
  eHud.appendChild(ce('div',{class:'hud-name'},wild+' Maths Monster'));
  eHud.appendChild(ce('div',{class:'hud-lv'},'Q.'+(S.level+1)));
  const eBg=ce('div',{class:'hud-bar-bg'});
  const eBar=ce('div',{class:'hud-bar',id:'enemy-hp-bar',style:{width:'100%',background:'#22e065'}});
  eBg.appendChild(eBar);eHud.appendChild(eBg);
  eHud.appendChild(ce('span',{class:'hud-type',style:{background:tc}},zone.pkType));
  scene.appendChild(eHud);

  const eSprite=ce('div',{class:'sprite-e idle',id:'sprite-e'},wild);
  scene.appendChild(eSprite);

  const pHud=ce('div',{class:'player-hud'});
  pHud.appendChild(ce('div',{class:'hud-name'},zone.pokemon+' '+zone.pkName));
  pHud.appendChild(ce('div',{class:'hud-lv'},'LV.'+(S.level+1)+' · '+zone.pkType));
  const hpRow=ce('div',{style:{display:'flex',alignItems:'center',gap:'3px',marginBottom:'2px'}});
  hpRow.appendChild(ce('span',{style:{fontSize:'7px',color:'#a0c4ff',fontWeight:800,minWidth:'16px'}},'HP'));
  const hpBg=ce('div',{class:'hud-bar-bg',style:{flex:1}});
  const hpC=S.hp>50?'#22e065':S.hp>25?'#ffcc00':'#ff4444';
  hpBg.appendChild(ce('div',{class:'hud-bar',id:'player-hp-bar',style:{width:S.hp+'%',background:hpC}}));
  hpRow.appendChild(hpBg);pHud.appendChild(hpRow);
  const xpRow=ce('div',{style:{display:'flex',alignItems:'center',gap:'3px'}});
  xpRow.appendChild(ce('span',{style:{fontSize:'7px',color:'#a0c4ff',fontWeight:800,minWidth:'16px'}},'XP'));
  const xpBg=ce('div',{class:'hud-bar-bg',style:{flex:1}});
  xpBg.appendChild(ce('div',{class:'hud-bar',id:'player-xp-bar',style:{width:S.xp+'%',background:'#6090ff'}}));
  xpRow.appendChild(xpBg);pHud.appendChild(xpRow);
  pHud.appendChild(ce('div',{class:'hud-hp-txt'},'HP '+S.hp+'/100'));
  scene.appendChild(pHud);

  const pSprite=ce('div',{class:'sprite-p',id:'sprite-p'},zone.pokemon);
  scene.appendChild(pSprite);
  bc.appendChild(scene);

  const qp=ce('div',{class:'qpanel'});
  qp.appendChild(ce('div',{class:'qtext'},lv.q));
  bc.appendChild(qp);

  const mb=ce('div',{class:'move-box'});
  const moveTypes=['NUMBER MOVE','MATHS DASH','THINK LEAP','BRAIN TANK'];
  const moveColors=['#4a8fdf','#3daa6e','#e8455a','#9b45e8'];
  lv.opts.forEach((opt,i)=>{
    const btn=ce('button',{class:'move-btn',id:'move-'+i,
      style:{borderColor:moveColors[i]+'55'},
      onclick:()=>pickAnswer(i)
    });
    btn.appendChild(ce('span',{class:'move-type',style:{color:moveColors[i]}},moveTypes[i]));
    btn.appendChild(document.createTextNode(opt));
    mb.appendChild(btn);
  });
  bc.appendChild(mb);

  const db=ce('div',{class:'dialogue-box'});
  db.appendChild(ce('span',{class:'dialogue-txt',id:'dlg-txt'},S.dialogueText||''));
  db.appendChild(ce('span',{class:'dialogue-cur'},'▼'));
  bc.appendChild(db);
  bc.appendChild(ce('div',{class:'feedback-area',id:'feedback-area'}));

  const aa=ce('div',{class:'action-area',id:'action-area'});
  aa.appendChild(ce('button',{class:'back-btn',onclick:()=>{save();renderMap();}},'🗺️ Map'));
  bc.appendChild(aa);
  wrap.appendChild(bc);
  wrap.appendChild(ce('div',{id:'teach-area'}));
  root.appendChild(wrap);

  typeDialogue('A wild maths monster appeared! What will '+zone.pkName+' do?');
}

/* ══ PICK ANSWER ══ */
function pickAnswer(i){
  if(S.chosen!==null)return;
  S.chosen=i;
  const LEVELS=currentLevels();
  const lv=LEVELS[Math.min(S.level,LEVELS.length-1)];
  const zone=ZONES[lv.z]||ZONES[0];
  const correct=(i===lv.ans);
  S.zoneAnswers.push({lvIdx:S.level,correct,yourAns:i,lv});

  const btn=el('move-'+i);
  if(btn){btn.className='move-btn '+(correct?'correct':'wrong');}
  for(let j=0;j<4;j++){const b=el('move-'+j);if(b)b.disabled=true;}

  const fa=el('feedback-area');
  if(fa){
    fa.innerHTML='';
    if(correct){
      fa.appendChild(ce('div',{class:'fb ok'},'⭐ '+zone.pkName+' — CORRECT! Great maths! 🎉'));
    } else {
      fa.appendChild(ce('div',{class:'fb no'},'💥 Not quite — look at the hint below!'));
    }
  }

  if(correct){
    const ps=el('sprite-p'),es=el('sprite-e');
    if(ps){ps.className='sprite-p attack';setTimeout(()=>{ps.className='sprite-p';},700);}
    if(es){setTimeout(()=>{es.className='sprite-e hit';},350);}
    setTimeout(()=>{if(es)es.className='sprite-e faint';},750);
    setTimeout(()=>{const b=el('enemy-hp-bar');if(b)b.style.width='0%';},400);
    doFlash(true);
    spawnConfetti();
    const gained=Math.floor(Math.random()*20)+15;
    showXP(gained);
    S.xp=(S.xp+gained)%100;
    S.score++;
    S.hp=Math.min(100,S.hp+4);
    const xpBar=el('player-xp-bar');if(xpBar)xpBar.style.width=S.xp+'%';
    const hpBar=el('player-hp-bar');if(hpBar)hpBar.style.width=S.hp+'%';
    typeDialogue('⭐ Brilliant! '+zone.pkName+' gained '+gained+' XP!');
    setTimeout(()=>showNextButton(true),800);
  } else {
    const ps=el('sprite-p');if(ps){ps.className='sprite-p flinch';setTimeout(()=>{ps.className='sprite-p';},500);}
    doFlash(false);
    S.hp=Math.max(8,S.hp-15);
    const hpBar=el('player-hp-bar');
    if(hpBar){const hpC=S.hp>50?'#22e065':S.hp>25?'#ffcc00':'#ff4444';hpBar.style.width=S.hp+'%';hpBar.style.background=hpC;}
    S.wrongCount++;
    typeDialogue('💥 Not quite! The teacher will explain below!');
    const ta=el('teach-area');
    if(ta){
      while(ta.firstChild)ta.removeChild(ta.firstChild);
      var tp=buildTeachPanel(lv,zone);
      if(tp)ta.appendChild(tp);
    }
    showNextButton(false);
  }
}

/* ══ NEXT BUTTON ══ */
function showNextButton(correct){
  const aa=el('action-area');if(!aa)return;
  const old=aa.querySelector('.next-btn');if(old)old.remove();
  const canRetry=!correct&&S.wrongCount<2;
  const btn=ce('button',{class:'next-btn',onclick:()=>{
    if(canRetry){
      S.chosen=null;
      for(let j=0;j<4;j++){const b=el('move-'+j);if(b){b.disabled=false;b.className='move-btn';b.style.borderColor=['#4a8fdf','#3daa6e','#e8455a','#9b45e8'][j]+'55';}}
      const fa=el('feedback-area');if(fa)fa.innerHTML='';
      const ta=el('teach-area');if(ta){while(ta.firstChild)ta.removeChild(ta.firstChild);}
      const old2=aa.querySelector('.next-btn');if(old2)old2.remove();
      typeDialogue('Try again, you can do it!');
    } else {
      advanceLevel();
    }
  }},canRetry?'🔄 Try Again':'▶ Next Question!');
  const back=aa.querySelector('.back-btn');
  if(back)aa.insertBefore(btn,back);
  else aa.appendChild(btn);
}

/* ══ ADVANCE LEVEL ══ */
function advanceLevel(){
  const LEVELS=currentLevels();
  const lv=LEVELS[Math.min(S.level,LEVELS.length-1)];
  const nx=S.level+1;
  const nb=BADGES.find(b=>b.at===nx&&!S.earnedBadges.find(x=>x.at===b.at));
  if(nb){S.earnedBadges.push(nb);showBadgeToast(nb);}
  const{last}=getLevelZoneRange(LEVELS,lv.z);
  if(S.level===last){
    S.completedZoneId=lv.z;
    S.level=nx;S.chosen=null;S.wrongCount=0;save();
    renderZoneComplete();
    return;
  }
  if(nx>=LEVELS.length){clearSave();renderEnd();return;}
  S.level=nx;S.chosen=null;S.wrongCount=0;save();renderBattle();
}

/* ══ ZONE COMPLETE ══ */
function renderZoneComplete(){
  const root=el('root');root.innerHTML='';
  const cZone=ZONES[S.completedZoneId]||ZONES[0];
  const zAnswers=S.zoneAnswers.filter(a=>a.lv&&a.lv.z===S.completedZoneId);
  const correctCount=zAnswers.filter(a=>a.correct).length;
  const total=Math.max(zAnswers.length,1);
  const rate=Math.round((correctCount/total)*100);
  const wrongAnswers=zAnswers.filter(a=>!a.correct);
  const rateColor=rate>=90?'#22c065':rate>=70?'#f5922f':'#e8455a';
  const rateMsg=rate===100?'🏆 Perfect! Amazing work!':rate>=80?'⭐ Great job!':rate>=60?'👍 Good effort!':'💪 Keep practising!';
  const zoneBadge=S.earnedBadges.find(b=>b.at===S.level||b.at===S.level-1);

  const wrap=ce('div',{class:'screen active',style:{padding:'10px 0'}});
  const card=ce('div',{class:'zc-card'});

  card.appendChild(ce('span',{class:'zc-pokemon'},cZone.pokemon));
  card.appendChild(ce('div',{class:'zc-title'},cZone.emoji+' '+cZone.name+' Complete!'));
  card.appendChild(ce('div',{class:'zc-sub'},cZone.pkName+' says: '+rateMsg));

  const rb=ce('div',{class:'zc-rate-box',style:{background:rateColor+'18',borderColor:rateColor}});
  rb.appendChild(ce('div',{class:'zc-rate-num',style:{color:rateColor}},rate+'%'));
  rb.appendChild(ce('div',{class:'zc-rate-lbl',style:{color:rateColor}},correctCount+' / '+total+' correct'));
  const barBg=ce('div',{class:'zc-bar-bg'});
  barBg.appendChild(ce('div',{class:'zc-bar-fill',style:{width:rate+'%',background:rateColor}}));
  rb.appendChild(barBg);card.appendChild(rb);

  if(zoneBadge){
    card.appendChild(ce('div',{class:'zc-badge',style:{background:zoneBadge.color+'18',borderColor:zoneBadge.color,color:zoneBadge.color}},'🏅 '+zoneBadge.label+' Unlocked!'));
  }

  if(wrongAnswers.length>0){
    const wb=ce('div',{class:'zc-wrong-box'});
    wb.appendChild(ce('div',{class:'zc-wrong-title'},'❌ Review ('+wrongAnswers.length+' questions)'));
    wrongAnswers.slice(0,5).forEach(a=>{
      const item=ce('div',{class:'zc-wrong-item'});
      item.appendChild(ce('div',{class:'zc-q'},'Q: '+(a.lv.q.length>75?a.lv.q.slice(0,75)+'…':a.lv.q)));
      const ans=ce('div',{class:'zc-ans'});
      ans.appendChild(ce('span',{class:'zc-your'},'Your: '+(a.lv.opts[a.yourAns]||'?')));
      ans.appendChild(ce('span',{class:'zc-correct'},'Correct: '+(a.lv.opts[a.lv.ans]||'?')));
      item.appendChild(ans);wb.appendChild(item);
    });
    if(wrongAnswers.length>5)wb.appendChild(ce('div',{style:{fontSize:'10px',color:'rgba(255,255,255,.35)',marginTop:'5px',fontWeight:700}},'...and '+(wrongAnswers.length-5)+' more'));
    card.appendChild(wb);
  }

  const sm=ce('div',{class:'zc-summary'});
  sm.appendChild(ce('div',{class:'zc-sum-title'},'🦉 Teacher\'s Summary'));
  sm.appendChild(ce('div',{class:'zc-sum-txt'},
    rate===100?'Perfect! You mastered '+cZone.name+'! You are ready for the next topic!':
    'You got '+correctCount+'/'+total+' correct in '+cZone.name+'. '+
    (wrongAnswers.length>0?'Review: '+wrongAnswers.slice(0,2).map(a=>(a.lv.opts[a.lv.ans]||'')).join(', '):'')
  ));
  card.appendChild(sm);

  const LEVELS=currentLevels();
  const ac=ce('div',{class:'zc-actions'});
  ac.appendChild(ce('button',{class:'zc-btn zc-token',onclick:function(){
    var diffLabel=DIFF_LABELS[S.diff]||S.diff;
    var msg='Hi Daddy! I just finished '+cZone.name+' ('+diffLabel+' Level) with '+correctCount+'/'+total+' correct ('+rate+'%). Can I please collect my maths token? 🌟';
    var url='https://wa.me/85251126007?text='+encodeURIComponent(msg);
    window.open(url,'_blank');
  }},'🪙 Collect Token from Daddy!'));
  if(S.level<LEVELS.length){
    ac.appendChild(ce('button',{class:'zc-btn zc-next',onclick:()=>{S.zoneAnswers=[];renderBattle();}},'▶ Continue to Next Zone'));
  } else {
    ac.appendChild(ce('button',{class:'zc-btn zc-next',onclick:()=>{clearSave();renderEnd();}},'🏆 Finish Game!'));
  }
  ac.appendChild(ce('button',{class:'zc-btn zc-map',onclick:()=>{S.zoneAnswers=[];renderMap();}},'🗺️ Back to Map'));
  card.appendChild(ac);
  wrap.appendChild(card);root.appendChild(wrap);

  if(rate>=70)spawnConfetti();
}

/* ══ END SCREEN ══ */
function renderEnd(){
  const root=el('root');root.innerHTML='';
  const LEVELS=currentLevels();
  const pct=Math.round((S.score/LEVELS.length)*100);
  const stars=pct>=90?3:pct>=70?2:1;
  const wrap=ce('div',{class:'screen active'});
  const card=ce('div',{class:'end-card'});
  card.appendChild(ce('span',{class:'end-pokemon'},pct>=80?'🏆':pct>=60?'⭐':'🌱'));
  card.appendChild(ce('div',{class:'star-row'},'⭐'.repeat(stars)+'☆'.repeat(3-stars)));
  card.appendChild(ce('div',{class:'end-title'},'You did it! 🎓'));
  card.appendChild(ce('div',{class:'end-sub'},DIFF_LABELS[S.diff]+' · '+S.score+'/'+LEVELS.length+' ('+pct+'%)'));
  const bSection=ce('div',{style:{margin:'12px 0',padding:'10px',background:'#f7fafd',borderRadius:10}});
  bSection.appendChild(ce('div',{style:{fontWeight:900,fontSize:12,color:'#1a2a3a',marginBottom:'7px'}},'🏅 Badges Earned'));
  const bg=ce('div',{class:'badge-grid'});
  BADGES.forEach(b=>{
    const earned=S.earnedBadges.some(x=>x.at===b.at);
    bg.appendChild(ce('div',{class:'badge-item',style:earned?{background:b.color+'18',borderColor:b.color,color:b.color}:{opacity:.2,borderColor:'#ccc',color:'#aaa'}},b.label));
  });
  bSection.appendChild(bg);card.appendChild(bSection);
  card.appendChild(ce('div',{style:{fontSize:12,color:'#555',marginBottom:'14px'}},
    pct===100?'🎊 PERFECT! Maths Superstar!':pct>=80?'🌟 Brilliant work, Year 1!':pct>=60?'👍 Well done!':'💪 Great effort — keep practising!'));
  card.appendChild(ce('button',{class:'btn btn-red',onclick:()=>renderSelectDiff()},'🔄 Play Again'));
  wrap.appendChild(card);root.appendChild(wrap);
  spawnConfetti();
}

/* ══ INIT ══ */
(function() {
  try {
    renderWelcome();
  } catch(e) {
    var d = document.getElementById('root');
    d.style.cssText = 'min-height:100vh;background:#1a1a2e;display:flex;align-items:center;justify-content:center;padding:20px';
    var box = document.createElement('div');
    box.style.cssText = 'background:#16213e;border-radius:20px;padding:28px;text-align:center;max-width:360px;width:100%;border:2px solid rgba(255,100,100,.3)';
    box.innerHTML = '<div style="font-size:40px;margin-bottom:12px">⚠️</div>' +
      '<div style="color:#ffd700;font-weight:900;font-size:18px;margin-bottom:8px;font-family:Arial,sans-serif">Game Error</div>' +
      '<div style="color:#a0c4ff;font-size:13px;margin-bottom:20px;font-family:Arial,sans-serif">' + (e.message || String(e)) + '</div>';
    var btn = document.createElement('button');
    btn.textContent = 'Restart Game';
    btn.style.cssText = 'background:#cc2200;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:bold;cursor:pointer;font-family:Arial,sans-serif';
    btn.onclick = function() { try{localStorage.removeItem('glenealy_y1_v1');}catch(ex){} location.reload(); };
    box.appendChild(btn);
    d.appendChild(box);
  }
})();
</script>
